<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 아이 영어, 학원 vs 공부방?</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF6EC;
    --warm: #F5E6CE;
    --green: #3D7A5E;
    --green-light: #6BAF8E;
    --green-pale: #D6EDDF;
    --orange: #E07B39;
    --orange-light: #F5A96B;
    --brown: #5C3D2E;
    --gray: #8A8078;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(109,175,142,0.12) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(224,123,57,0.1) 0%, transparent 50%);
  }

  .container {
    width: 100%;
    max-width: 600px;
  }

  /* ── INTRO ── */
  .intro-card {
    background: var(--white);
    border-radius: 28px;
    padding: 48px 40px;
    box-shadow: 0 8px 40px rgba(61,122,94,0.12), 0 2px 8px rgba(0,0,0,0.06);
    text-align: center;
  }

  .frog-icon {
    font-size: 64px;
    margin-bottom: 12px;
    display: block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .intro-tag {
    display: inline-block;
    background: var(--green-pale);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .intro-title {
    font-family: 'Gowun Batang', serif;
    font-size: 26px;
    color: var(--brown);
    line-height: 1.45;
    margin-bottom: 10px;
  }

  .intro-sub {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.75;
    margin-bottom: 32px;
  }

  .btn-start {
    display: inline-block;
    background: var(--green);
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 18px rgba(61,122,94,0.35);
  }
  .btn-start:hover {
    background: #2d6349;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(61,122,94,0.40);
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--white);
    border-radius: 28px;
    padding: 40px 36px;
    box-shadow: 0 8px 40px rgba(61,122,94,0.12), 0 2px 8px rgba(0,0,0,0.06);
    display: none;
    animation: slideIn 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)  scale(1); }
  }

  .progress-bar {
    background: var(--green-pale);
    border-radius: 10px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  .q-step {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .q-emoji {
    font-size: 42px;
    margin-bottom: 14px;
    display: block;
  }

  .q-text {
    font-family: 'Gowun Batang', serif;
    font-size: 21px;
    color: var(--brown);
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .q-hint {
    font-size: 12.5px;
    color: var(--gray);
    margin-bottom: 28px;
    line-height: 1.65;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .btn-yes, .btn-no {
    padding: 16px 12px;
    border-radius: 16px;
    border: 2.5px solid transparent;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.22s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .btn-yes {
    background: var(--green-pale);
    color: var(--green);
    border-color: #b2dcc5;
  }
  .btn-yes:hover {
    background: var(--green);
    color: white;
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(61,122,94,0.3);
  }
  .btn-no {
    background: #FEF0E6;
    color: var(--orange);
    border-color: #f5c9a3;
  }
  .btn-no:hover {
    background: var(--orange);
    color: white;
    border-color: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(224,123,57,0.3);
  }

  .btn-label-big { font-size: 22px; }

  /* ── RESULT CARD ── */
  .result-card {
    background: var(--white);
    border-radius: 28px;
    padding: 44px 36px;
    box-shadow: 0 8px 40px rgba(61,122,94,0.12), 0 2px 8px rgba(0,0,0,0.06);
    display: none;
    text-align: center;
    animation: slideIn 0.5s cubic-bezier(0.22,1,0.36,1);
  }

  .result-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }
  .badge-hakwon { background: #DDEEFF; color: #2255AA; }
  .badge-study  { background: var(--green-pale); color: var(--green); }
  .badge-both   { background: #F0E6FF; color: #6633CC; }

  .result-emoji { font-size: 72px; margin-bottom: 10px; display: block; }

  .result-title {
    font-family: 'Gowun Batang', serif;
    font-size: 24px;
    color: var(--brown);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .result-sub {
    font-size: 13.5px;
    color: var(--gray);
    margin-bottom: 24px;
  }

  .result-desc {
    background: var(--cream);
    border-radius: 16px;
    padding: 22px 22px;
    text-align: left;
    margin-bottom: 20px;
  }
  .result-desc p {
    font-size: 14px;
    color: #4a3f35;
    line-height: 1.85;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .tag {
    background: var(--warm);
    color: var(--brown);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 20px;
  }

  .rebit-box {
    background: linear-gradient(135deg, var(--green-pale) 0%, #e8f8f0 100%);
    border: 1.5px solid #b2dcc5;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 24px;
    text-align: left;
  }
  .rebit-box .rebit-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .rebit-box p {
    font-size: 13.5px;
    color: var(--brown);
    line-height: 1.75;
  }

  .btn-retry {
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 13px 36px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.22s;
  }
  .btn-retry:hover {
    background: var(--green);
    color: white;
  }

  /* mobile */
  @media (max-width: 480px) {
    .intro-card, .question-card, .result-card { padding: 36px 24px; }
    .intro-title { font-size: 22px; }
    .q-text { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- INTRO -->
  <div class="intro-card" id="introCard">
    <span class="frog-icon">🐸</span>
    <div class="intro-tag">영어 선택 가이드</div>
    <h1 class="intro-title">우리 아이 영어,<br>학원이 맞을까요?<br>공부방이 맞을까요?</h1>
    <p class="intro-sub">
      YES / NO 질문 8개만 답하면<br>
      아이에게 맞는 영어 환경을 알려드려요.<br>
      솔직하게 답할수록 정확해집니다 🙂
    </p>
    <button class="btn-start" onclick="startTest()">테스트 시작하기 →</button>
  </div>

  <!-- QUESTION -->
  <div class="question-card" id="questionCard">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-step" id="qStep">Q1 / 8</div>
    <span class="q-emoji" id="qEmoji"></span>
    <div class="q-text" id="qText"></div>
    <div class="q-hint" id="qHint"></div>
    <div class="btn-row">
      <button class="btn-yes" onclick="answer(true)">
        <span class="btn-label-big">👍</span>
        <span>YES</span>
      </button>
      <button class="btn-no" onclick="answer(false)">
        <span class="btn-label-big">🙅</span>
        <span>NO</span>
      </button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result-card" id="resultCard"></div>

</div>

<script>
// ── 결정 트리 ──

// 리프 노드: { result: "hakwon" | "studyroom" | "both" }

    yes: "r_hakwon_strong",

  q4b: {

    yes: "r_studyroom_pace",
    no:  "r_hakwon_budget"

// ── 상태 ──
let current = "q1";
let step = 0;
const maxSteps = 8;

function startTest() {
  document.getElementById("introCard").style.display = "none";
  document.getElementById("questionCard").style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  const node = tree[current];
  if (node.result) { showResult(node); return; }

  step++;
  document.getElementById("qStep").textContent = `Q${step} / ${maxSteps}`;
  document.getElementById("progressFill").style.width = `${(step / maxSteps) * 100}%`;
  document.getElementById("qEmoji").textContent = node.emoji;
  document.getElementById("qText").textContent = node.q;
  document.getElementById("qHint").textContent = node.hint;

  // restart animation
  const card = document.getElementById("questionCard");
  card.style.animation = "none";
  card.offsetHeight;
  card.style.animation = "";
}

function answer(isYes) {
  const node = tree[current];
  current = isYes ? node.yes : node.no;
  const next = tree[current];
  if (next.result) { showResult(next); }
  else { renderQuestion(); }
}

function showResult(node) {
  document.getElementById("questionCard").style.display = "none";
  const rc = document.getElementById("resultCard");
  rc.style.display = "block";

  const r = results[node.result];
  const t = r.types[node.type];

  const tagsHtml = t.tags.map(tag => `<span class="tag">#${tag}</span>`).join("");

  rc.innerHTML = `
    <span class="result-emoji">${r.emoji}</span>
    <div class="result-badge ${r.badge}">${r.badgeText}</div>
    <div class="result-title">${t.title}</div>
    <div class="result-sub">${t.sub}</div>
    <div class="result-desc"><p>${r.desc}</p></div>
    <div class="result-tags">${tagsHtml}</div>
    <div class="rebit-box">
      <div class="rebit-label">🐸 리빗 한마디</div>
      <p>${r.rebit}</p>
    </div>
    <button class="btn-retry" onclick="retryTest()">↩ 다시 테스트하기</button>
  `;

  rc.style.animation = "none";
  rc.offsetHeight;
  rc.style.animation = "";
}

function retryTest() {
  current = "q1";
  step = 0;
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("introCard").style.display = "block";
}
</script>
