<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리빗 포인트 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-mid: #9FE1CB;
    --green-dark: #0F6E56;
    --green-deeper: #085041;
    --red: #993C1D;
    --red-light: #FAECE7;
    --red-mid: #F5C4B3;
    --gray-100: #f7f6f3;
    --gray-200: #eeece7;
    --gray-300: #d3d1c7;
    --gray-500: #888780;
    --gray-700: #444441;
    --gray-900: #2C2C2A;
    --text: #2C2C2A;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--gray-100);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .app-header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-frog {
    width: 34px;
    height: 34px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 17px; font-weight: 800; color: var(--green-dark); }
  .logo-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .header-btns { display: flex; gap: 8px; }
  .btn {
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    transition: background .12s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { background: var(--gray-100); }
  .btn-green {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .btn-green:hover { background: var(--green-dark); border-color: var(--green-dark); }

  /* ── Layout ── */
  .main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ── Section label ── */
  .sec-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── Students ── */
  .students-wrap { margin-bottom: 20px; }
  .students-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .student-card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    user-select: none;
    position: relative;
  }
  .student-card:hover {
    border-color: var(--green-mid);
    box-shadow: 0 2px 10px rgba(29,158,117,.1);
  }
  .student-card:active { transform: scale(.97); }
  .student-card.active {
    border-color: var(--green);
    background: var(--green-light);
    box-shadow: 0 2px 12px rgba(29,158,117,.2);
  }
  .s-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--gray-200);
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    color: var(--text-muted);
    transition: background .15s, color .15s;
  }
  .student-card.active .s-avatar {
    background: var(--green);
    color: #fff;
  }
  .s-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .student-card.active .s-name { color: var(--green-deeper); }
  .s-pts {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    margin-bottom: 2px;
    font-family: 'Nanum Gothic Coding', monospace;
  }
  .student-card.active .s-pts { color: var(--green-dark); }
  .s-unit { font-size: 11px; color: var(--text-muted); }
  .s-delta {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 12px;
    font-weight: 800;
    min-width: 10px;
    height: 16px;
    line-height: 16px;
  }
  .s-delta.plus { color: var(--green); }
  .s-delta.minus { color: var(--red); }
  .add-student-card {
    background: transparent;
    border: 1.5px dashed var(--gray-300);
    border-radius: var(--radius);
    padding: 12px 8px 10px;
    text-align: center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    transition: border-color .12s, color .12s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 100px;
  }
  .add-student-card:hover { border-color: var(--green); color: var(--green); }
  .add-student-card svg { width: 22px; height: 22px; }

  /* ── Actions ── */
  .actions-wrap {
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 20px;
  }
  .actions-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .selected-badge {
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    background: var(--green-light);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 8px;
  }
  .action-btn {
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    text-align: left;
    cursor: pointer;
    font-family: 'Nanum Gothic', sans-serif;
    border: 1.5px solid;
    transition: transform .1s, box-shadow .1s;
  }
  .action-btn:active { transform: scale(.97); }
  .action-btn.pos {
    background: var(--green-light);
    border-color: var(--green-mid);
  }
  .action-btn.pos:hover { box-shadow: 0 2px 8px rgba(29,158,117,.2); }
  .action-btn.neg {
    background: var(--red-light);
    border-color: var(--red-mid);
  }
  .action-btn.neg:hover { box-shadow: 0 2px 8px rgba(153,60,29,.15); }
  .a-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3; }
  .a-pts { font-size: 20px; font-weight: 800; font-family: 'Nanum Gothic Coding', monospace; }
  .action-btn.pos .a-pts { color: var(--green-dark); }
  .action-btn.neg .a-pts { color: var(--red); }

  .no-select {
    text-align: center;
    padding: 24px 0;
    color: var(--text-muted);
    font-size: 14px;
  }
  .no-select span { display: block; font-size: 28px; margin-bottom: 8px; }

  /* ── Log ── */
  .log-wrap {
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
  }
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .log-list { max-height: 220px; overflow-y: auto; }
  .log-item {
    display: flex;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--gray-200);
    gap: 8px;
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-name { font-weight: 700; min-width: 50px; color: var(--text); }
  .log-action { flex: 1; color: var(--text-muted); font-size: 12px; }
  .log-pt { font-weight: 800; font-family: 'Nanum Gothic Coding', monospace; font-size: 14px; min-width: 36px; text-align: right; }
  .log-pt.p { color: var(--green-dark); }
  .log-pt.n { color: var(--red); }
  .log-time { font-size: 11px; color: var(--gray-300); min-width: 40px; text-align: right; }
  .log-empty { font-size: 13px; color: var(--text-muted); padding: 12px 0; text-align: center; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,.15);
  }
  .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--gray-100);
    margin-bottom: 12px;
    outline: none;
    transition: border-color .12s;
  }
  .modal input:focus { border-color: var(--green); background: #fff; }
  .modal-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; margin-top: -8px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--gray-900);
    color: #fff;
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 24px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Reset confirm ── */
  .danger-btn { color: #A32D2D; border-color: #F5C4B3; }
  .danger-btn:hover { background: var(--red-light); }

  @media (max-width: 480px) {
    .app-header { padding: 12px 14px; }
    .header-btns .btn span { display: none; }
    .main { padding: 14px 12px 60px; }
    .students-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    .actions-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-frog">🐸</div>
    <div>
      <div class="logo-text">Rebit 포인트</div>
      <div class="logo-sub">리빗 영어 스터디룸</div>
    </div>
  </div>
  <div class="header-btns">
    <button class="btn" onclick="exportCSV()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span>CSV 저장</span>
    </button>
    <button class="btn danger-btn" onclick="resetConfirm()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1018 0 9 9 0 00-18 0M3 12h4m14 0h-4"/></svg>
      <span>초기화</span>
    </button>
  </div>
</header>

<main class="main">

  <!-- 학생 -->
  <div class="students-wrap">
    <div class="sec-label">학생 선택</div>
    <div class="students-grid" id="studentsGrid"></div>
  </div>

  <!-- 행동 버튼 -->
  <div class="actions-wrap">
    <div id="actionsArea">
      <div class="no-select">
        <span>☝️</span>
        위에서 학생을 선택하면 행동 버튼이 나타납니다
      </div>
    </div>
  </div>

  <!-- 기록 -->
  <div class="log-wrap">
    <div class="log-header">
      <div class="sec-label" style="margin-bottom:0">최근 기록</div>
      <button class="btn" onclick="clearLog()" style="font-size:12px;padding:5px 10px">지우기</button>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

</main>

<!-- 학생 추가 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>학생 추가</h3>
    <input type="text" id="nameInput" placeholder="예: 지수, 민준, 서아" />
    <p class="modal-hint">여러 명은 쉼표(,)로 구분해 주세요</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-green" onclick="addStudents()">추가하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ACTIONS = [
  { label: '영어책 소리 내어 읽기', pts: 2 },
  { label: '오늘의 문장 3개 말하기', pts: 3 },
  { label: '질문 1개 만들기', pts: 2 },
  { label: '친구 발표 듣기', pts: 1 },
  { label: '숙제 안 가져오기', pts: -1 },
  { label: '수업 중 계속 한국말만 하기', pts: -1 },
];

let students = JSON.parse(localStorage.getItem('rebit_students') || 'null');
let log = JSON.parse(localStorage.getItem('rebit_log') || '[]');
let selected = null;
const deltas = {};

if (!students) {
  students = [
    { name: '학생1', pts: 0 },
    { name: '학생2', pts: 0 },
    { name: '학생3', pts: 0 },
  ];
  save();
}

function save() {
  localStorage.setItem('rebit_students', JSON.stringify(students));
  localStorage.setItem('rebit_log', JSON.stringify(log));
}

function initials(name) {
  return name.charAt(0).toUpperCase();
}

function render() {
  renderStudents();
  renderActions();
  renderLog();
}

function renderStudents() {
  const g = document.getElementById('studentsGrid');
  g.innerHTML = '';

  students.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'student-card' + (selected === i ? ' active' : '');
    const d = deltas[i];
    const deltaHtml = d !== undefined
      ? `<div class="s-delta ${d > 0 ? 'plus' : 'minus'}">${d > 0 ? '+' : ''}${d}</div>`
      : '';
    card.innerHTML = `
      ${deltaHtml}
      <div class="s-avatar">${initials(s.name)}</div>
      <div class="s-name">${s.name}</div>
      <div class="s-pts">${s.pts}</div>
      <div class="s-unit">점</div>
    `;
    card.onclick = () => { selected = i; render(); };
    g.appendChild(card);
  });

  // 추가 버튼
  const addCard = document.createElement('div');
  addCard.className = 'add-student-card';
  addCard.innerHTML = `
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 7a4 4 0 108 0 4 4 0 00-8 0M19 8v6M22 11h-6"/>
    </svg>
    학생 추가
  `;
  addCard.onclick = openModal;
  g.appendChild(addCard);
}

function renderActions() {
  const area = document.getElementById('actionsArea');
  if (selected === null) {
    area.innerHTML = `<div class="no-select"><span>☝️</span>위에서 학생을 선택하면 행동 버튼이 나타납니다</div>`;
    return;
  }
  const s = students[selected];
  let html = `
    <div class="actions-header">
      <div class="sec-label" style="margin-bottom:0">행동 기록</div>
      <div class="selected-badge">${s.name} 선택됨</div>
    </div>
    <div class="actions-grid">
  `;
  ACTIONS.forEach((a, i) => {
    html += `
      <button class="action-btn ${a.pts > 0 ? 'pos' : 'neg'}" onclick="applyAction(${i})">
        <div class="a-label">${a.label}</div>
        <div class="a-pts">${a.pts > 0 ? '+' : ''}${a.pts}점</div>
      </button>
    `;
  });
  html += '</div>';
  area.innerHTML = html;
}

function renderLog() {
  const el = document.getElementById('logList');
  if (!log.length) {
    el.innerHTML = '<div class="log-empty">아직 기록이 없습니다</div>';
    return;
  }
  el.innerHTML = log.slice(0, 50).map(l => `
    <div class="log-item">
      <span class="log-name">${l.name}</span>
      <span class="log-action">${l.action}</span>
      <span class="log-pt ${l.pts > 0 ? 'p' : 'n'}">${l.pts > 0 ? '+' : ''}${l.pts}</span>
      <span class="log-time">${l.time}</span>
    </div>
  `).join('');
}

function applyAction(ai) {
  if (selected === null) return;
  const a = ACTIONS[ai];
  students[selected].pts += a.pts;
  deltas[selected] = (deltas[selected] || 0) + a.pts;

  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  log.unshift({
    name: students[selected].name,
    action: a.label,
    pts: a.pts,
    time: timeStr,
    date: now.toLocaleDateString('ko-KR'),
  });
  if (log.length > 200) log = log.slice(0, 200);
  save();
  render();

  clearTimeout(deltas['_t' + selected]);
  deltas['_t' + selected] = setTimeout(() => {
    delete deltas[selected];
    delete deltas['_t' + selected];
    renderStudents();
  }, 1400);

  showToast(`${students[selected].name} · ${a.label} ${a.pts > 0 ? '+' : ''}${a.pts}점`);
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('nameInput').value = '';
  setTimeout(() => document.getElementById('nameInput').focus(), 60);
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function addStudents() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  val.split(',').map(n => n.trim()).filter(Boolean).forEach(name => {
    students.push({ name, pts: 0 });
  });
  save();
  render();
  closeModal();
  showToast('학생이 추가되었습니다');
}

function clearLog() {
  if (!confirm('최근 기록을 모두 지울까요?')) return;
  log = [];
  save();
  renderLog();
  showToast('기록이 삭제되었습니다');
}

function exportCSV() {
  const header = '날짜,시간,학생,행동,포인트\n';
  const rows = log.map(l => `${l.date},${l.time},${l.name},${l.action},${l.pts}`).join('\n');
  const summary = '\n\n학생 이름,누적 포인트\n' + students.map(s => `${s.name},${s.pts}`).join('\n');
  const blob = new Blob(['\uFEFF' + header + rows + summary], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rebit_points_${new Date().toLocaleDateString('ko-KR').replace(/\. /g, '-').replace('.', '')}.csv`;
  a.click();
  showToast('CSV 파일이 저장되었습니다');
}

function resetConfirm() {
  if (!confirm('모든 포인트를 0으로 초기화할까요?\n학생 명단은 유지됩니다.')) return;
  students = students.map(s => ({ ...s, pts: 0 }));
  log = [];
  selected = null;
  save();
  render();
  showToast('초기화 완료');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

// 모달 바깥 클릭 닫기
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addStudents();
});

render();
</script>
</body>
</html>
